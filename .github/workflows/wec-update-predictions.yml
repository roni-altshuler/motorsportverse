name: WEC — Update Race Predictions

# FIA WEC endurance-weekend automation. The committed data/official_2026.json is
# the offline source of truth; a guarded live re-pull from the official Al Kamel
# timing archive (static CSV classifications, reachable from GitHub runners) can
# only ADD completed rounds (build_snapshot's regression guard refuses to regress).
# A cheap freshness pre-check skips the heavier multi-season pull when nothing new
# is scored.
#
# WEC rounds are ~monthly, run Fri-Sun (6h races settle late Sat/Sun; Le Mans is a
# 24h race over a June weekend), so the poll casts a Sat-Sun window plus a Monday
# safety net.

on:
  schedule:
    - cron: "30 6-22/3 * * 6"   # Saturday
    - cron: "30 6-22/3 * * 0"   # Sunday (main result window)
    - cron: "30 0-6 * * 1"      # Sunday-night spillover
    - cron: "0 10,22 * * 1"     # Monday safety net
  workflow_dispatch:
    inputs:
      force:
        description: "Run the pull even if the freshness gate says nothing new"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wec-update-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: |
          pip install -e packages/motorsport-core -e packages/motorsport-data
          pip install -e projects/wec-predictions --no-deps
          pip install requests numpy matplotlib pytest

      - name: Freshness gate — has a new round been scored?
        id: check
        working-directory: projects/wec-predictions
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual force-run — skipping the freshness gate."
          else
            PYTHONPATH=src python scripts/freshness_gate.py >> "$GITHUB_OUTPUT"
          fi

      - name: Re-pull the snapshot (guarded live archive fetch)
        if: steps.check.outputs.should_run == 'true'
        working-directory: projects/wec-predictions
        run: PYTHONPATH=src python -m wec_predictions.refresh --season 2026 --skip-forward-eval

      - name: Regenerate site dataset (fresh processes pick up new rounds)
        if: steps.check.outputs.should_run == 'true'
        working-directory: projects/wec-predictions
        run: |
          PYTHONPATH=src python -m wec_predictions.export
          PYTHONPATH=src python -m wec_predictions.forward_eval --season 2026 --allow-empty


      - name: Publish evidence artifact
        # Rebuild the model-vs-baseline block from the forward-eval that just
        # ran, so evidence.json ships with the round it describes rather than a
        # round behind. CI asserts this is current (build_evidence.py --check).
        working-directory: .
        run: python scripts/build_evidence.py wec-predictions
      - name: Validate generated outputs
        if: steps.check.outputs.should_run == 'true'
        # This cron had NO pre-commit gate at all — it installed pytest and
        # never ran it, so degenerate output could reach Pages unchallenged.
        run: |
          cd projects/wec-predictions
          # The export tests are this product's analogue of the other
          # crons' test_website_data_schema.py: they assert the shape and
          # sanity of what was just written. The snapshot tests are left
          # out on purpose — they exercise the live archive fetch, which
          # is a different failure domain from 'is this output publishable'.
          PYTHONPATH=src python -m pytest tests/test_export_wec.py tests/test_model_wec.py -q
      - name: Published-data integrity gate
        if: steps.check.outputs.should_run == 'true'
        # Corpus gate before commit. The schema test above proves each FILE is
        # well-formed; this proves the numbers inside them add up. A cron commit
        # pushes with GITHUB_TOKEN, which by design does NOT trigger CI — so
        # whatever is not checked HERE is not checked at all until a human
        # pushes a branch. That is how a completed Formula E season sat on main
        # for a day with a permanently failing source test (b0f4976).
        run: python scripts/validate_published_data.py wec-predictions
      - name: Commit refreshed data if changed
        id: commit
        if: steps.check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "committed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f projects/wec-predictions/data/official_*.json \
                     projects/wec-predictions/website/public/data
          if git diff --cached --quiet; then
            echo "No data changes — snapshot already current."
            exit 0
          fi
          git commit -m "[wec] Update predictions ($(date -u +%Y-%m-%d))"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/safe_push.sh
          echo "committed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: predict
    if: needs.predict.outputs.committed == 'true'
    uses: ./.github/workflows/deploy-website.yml
    permissions:
      contents: read
      pages: write
      id-token: write
