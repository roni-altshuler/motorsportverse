name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Packages + registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/motorsport-core[dev]"
          pip install -e "packages/motorsport-data[dev]"
          pip install -e projects/f2-predictions --no-deps
          pip install -e projects/f3-predictions --no-deps
          # --no-deps like F2/F3 (core/data are the editable installs above);
          # FE's remaining direct deps are installed explicitly.
          pip install -e projects/formula-e-predictions --no-deps
          pip install -e projects/nascar-predictions --no-deps
          pip install -e projects/indycar-predictions --no-deps
          pip install -e projects/motogp-predictions --no-deps
          pip install -e projects/wrc-predictions --no-deps
          pip install -e projects/wec-predictions --no-deps
          pip install -e projects/imsa-predictions --no-deps
          pip install requests numpy matplotlib
          # xgboost powers the full GBR+XGB skill ensemble; sklearn comes via core.
          # Without it the model degrades to a GBR-only signal, so this is for parity.
          pip install xgboost

      - name: Lint
        run: |
          # Pin ruff: an unpinned install silently tracks the latest release, and
          # every ruff version widens its default ruleset — so CI would go red on a
          # ruff release with no code change. Bump this deliberately.
          pip install ruff==0.16.1
          # projects/f1-predictions has its own ruff config + dedicated f1-ci.yml,
          # so it is intentionally excluded here.
          ruff check packages/motorsport-core packages/motorsport-data scripts \
            $(ls -d projects/*/ | grep -v f1-predictions)

      - name: Test motorsport-core
        run: pytest packages/motorsport-core -q

      - name: Test motorsport-data
        run: pytest packages/motorsport-data -q

      - name: Test f2-predictions
        run: pytest projects/f2-predictions -q

      - name: Test f3-predictions
        run: pytest projects/f3-predictions -q

      - name: Test formula-e-predictions
        run: pytest projects/formula-e-predictions -q

      - name: Test nascar-predictions
        run: pytest projects/nascar-predictions -q

      - name: Test indycar-predictions
        run: pytest projects/indycar-predictions -q

      - name: Test motogp-predictions
        run: pytest projects/motogp-predictions -q

      - name: Test wrc-predictions
        run: pytest projects/wrc-predictions -q

      - name: Test wec-predictions
        run: pytest projects/wec-predictions -q

      - name: Test imsa-predictions
        run: pytest projects/imsa-predictions -q

      - name: Test scaffolded series projects
        run: |
          for p in lemans; do
            (cd "projects/${p}-predictions" && PYTHONPATH=src pytest -q)
          done

      - name: Validate registry
        run: python scripts/build_registry.py

      - name: Published-data integrity
        # Checks the published corpus against ITSELF — market mass, calendar
        # coverage, chronology, duplicate and placeholder entrants, calibration
        # honesty, baseline presence. The per-file schema tests above all passed
        # for a month while calibrated win markets summed to 2.00, because no
        # check compared the corpus with the claims made about it.
        #
        # A known failure may only be carried with an explicit `--allow <check>`
        # written HERE, in the workflow that grants it, never in a config file,
        # and deleted in the same PR as the fix. See docs/KNOWN_ISSUES.md.
        run: python scripts/validate_published_data.py

      - name: Evidence artifacts are current
        # evidence.json must match what the published forward-eval implies. If
        # this fails, a site is rendering a model-vs-baseline comparison built
        # from data that has since moved.
        run: python scripts/build_evidence.py --check

      - name: Shared-UI drift check
        run: node scripts/sync_shared_ui.mjs --check

      - name: Chart palette validation
        # The --viz-* tokens carry specific claims (CVD ΔE, contrast, monotone
        # lightness). This is what makes them checkable rather than asserted.
        run: node scripts/validate_palette.js --ordinal --pairs all

  websites:
    name: Website tests + build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: website
          - site: projects/f1-predictions/website
            # Tests run; the full build does not. The flagship's prebuild does
            # image processing (OG cards, PNG→WebP via sharp) that belongs with
            # its own deploy, not in the ecosystem gate. Its tests are what pin
            # the shared components, and those are the canonical copies.
            build: skip
          - site: projects/f2-predictions/website
          - site: projects/f3-predictions/website
          - site: projects/formula-e-predictions/website
          - site: projects/imsa-predictions/website
          - site: projects/indycar-predictions/website
          - site: projects/motogp-predictions/website
          - site: projects/nascar-predictions/website
          - site: projects/wec-predictions/website
          - site: projects/wrc-predictions/website
    defaults:
      run:
        working-directory: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Test
        run: npm test -- --ci
      - name: Build
        if: matrix.build != 'skip'
        # The hub's prebuild regenerates public/data/registry.json; the series
        # sites read their committed JSON. PAGES_BASE_PATH is empty so the build
        # matches a local run rather than the Pages assembly.
        #
        # Retried because every site imports `next/font/google`, so each build
        # FETCHES fonts from Google's CDN and a blip fails it with
        # "Error while requesting resource" — nothing to do with the code. That
        # was survivable when CI built one site; this matrix builds ten, so the
        # per-run odds of hitting it are ten times higher and it started showing
        # up immediately. A genuine build error still fails, just three times.
        #
        # The real fix is to vendor the fonts and use `next/font/local`, which
        # removes the network from the build entirely. That is a deliberate
        # change across ten sites, not something to slip into a retry loop.
        run: |
          for attempt in 1 2 3; do
            if PAGES_BASE_PATH= npm run build; then
              exit 0
            fi
            echo "::warning::build attempt ${attempt} failed for ${{ matrix.site }}"
            sleep 15
          done
          echo "::error::build failed three times for ${{ matrix.site }}"
          exit 1
